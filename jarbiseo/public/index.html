<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARBISEO — 자비서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060A12;
    --panel: #0D1520;
    --line: #22304a;
    --gold: #D9A441;
    --teal: #3FA7A0;
    --text: #E6E9EF;
    --muted: #7C8798;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans KR', sans-serif;
    font-size: 14px;
  }
  #scene { position: fixed; inset: 0; display: block; }

  .mono {
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.18em;
  }

  /* ---------- HUD header ---------- */
  #hud {
    position: fixed; top: 22px; left: 26px; z-index: 10;
    pointer-events: none;
  }
  #hud h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px; font-weight: 700;
    letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--gold);
    text-shadow: 0 0 18px rgba(217, 164, 65, 0.35);
  }
  #hud .sub {
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--muted);
  }
  #hud .status { margin-top: 10px; font-size: 11px; color: var(--teal); }

  /* ---------- Top-right controls ---------- */
  #controls {
    position: fixed; top: 22px; right: 26px; z-index: 10;
    display: flex; gap: 8px; align-items: center;
  }
  .ctl-btn {
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(13, 21, 32, 0.72);
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--text);
    font-size: 16px; cursor: pointer;
    backdrop-filter: blur(10px);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .ctl-btn:hover { border-color: var(--gold); box-shadow: 0 0 12px rgba(217, 164, 65, 0.25); }
  .ctl-btn.active { border-color: var(--teal); box-shadow: 0 0 12px rgba(63, 167, 160, 0.4); }
  #voiceSelect {
    max-width: 210px; height: 38px;
    background: rgba(13, 21, 32, 0.72);
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--muted);
    font-family: 'IBM Plex Sans KR', sans-serif;
    font-size: 11px;
    padding: 0 8px;
    backdrop-filter: blur(10px);
    cursor: pointer;
  }

  /* ---------- Chat panel ---------- */
  #chatPanel {
    position: fixed; right: 26px; bottom: 26px; top: 84px; z-index: 10;
    width: 372px;
    display: flex; flex-direction: column;
    background: rgba(13, 21, 32, 0.68);
    border: 1px solid var(--line);
    border-radius: 14px;
    backdrop-filter: blur(14px);
    overflow: hidden;
  }
  #chatHeader {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--muted);
    display: flex; justify-content: space-between; align-items: center;
  }
  #chatHeader .dot { color: var(--teal); }
  #messages {
    flex: 1; overflow-y: auto;
    padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }
  .msg { max-width: 88%; line-height: 1.55; font-size: 13px; }
  .msg .who {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    margin-bottom: 4px; color: var(--muted);
  }
  .msg.user { align-self: flex-end; text-align: right; }
  .msg.user .bubble {
    display: inline-block; text-align: left;
    background: rgba(63, 167, 160, 0.12);
    border: 1px solid rgba(63, 167, 160, 0.35);
    border-radius: 10px 10px 2px 10px;
    padding: 9px 12px;
  }
  .msg.assistant .bubble {
    display: inline-block;
    background: rgba(217, 164, 65, 0.08);
    border: 1px solid rgba(217, 164, 65, 0.3);
    border-radius: 10px 10px 10px 2px;
    padding: 9px 12px;
  }
  .msg.system .bubble {
    display: inline-block;
    color: var(--muted); font-size: 12px;
    border: 1px dashed var(--line);
    border-radius: 10px; padding: 7px 11px;
  }
  #inputRow {
    display: flex; gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--line);
  }
  #chatInput {
    flex: 1;
    background: rgba(6, 10, 18, 0.8);
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--text);
    font-family: 'IBM Plex Sans KR', sans-serif;
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
  }
  #chatInput:focus { border-color: var(--gold); }
  #micBtn.listening { border-color: var(--gold); box-shadow: 0 0 14px rgba(217, 164, 65, 0.5); animation: micPulse 1.2s infinite; }
  @keyframes micPulse { 50% { box-shadow: 0 0 4px rgba(217, 164, 65, 0.2); } }
  #sendBtn {
    width: 44px;
    background: rgba(217, 164, 65, 0.14);
    border: 1px solid var(--gold);
    border-radius: 9px;
    color: var(--gold);
    font-size: 15px; cursor: pointer;
    transition: background 0.2s;
  }
  #sendBtn:hover { background: rgba(217, 164, 65, 0.28); }
  #sendBtn:disabled { opacity: 0.4; cursor: wait; }

  /* ---------- Project card ---------- */
  #projectCard {
    position: fixed; left: 26px; bottom: 26px; z-index: 10;
    width: 330px;
    background: rgba(13, 21, 32, 0.78);
    border: 1px solid var(--gold);
    border-radius: 14px;
    backdrop-filter: blur(14px);
    padding: 18px;
    display: none;
    box-shadow: 0 0 32px rgba(217, 164, 65, 0.12);
  }
  #projectCard.show { display: block; animation: cardIn 0.22s ease-out; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } }
  #cardClose {
    position: absolute; top: 10px; right: 12px;
    background: none; border: none; color: var(--muted);
    font-size: 15px; cursor: pointer;
  }
  #cardClose:hover { color: var(--text); }
  #cardName {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px; padding-right: 20px;
  }
  #cardDesc { font-size: 12px; color: var(--text); line-height: 1.6; margin-bottom: 12px; word-break: break-all; }
  #cardChildren { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  #cardChildren span {
    font-size: 11px; color: var(--teal);
    border: 1px solid rgba(63, 167, 160, 0.4);
    border-radius: 6px; padding: 3px 8px;
  }
  #briefBtn {
    width: 100%;
    background: rgba(217, 164, 65, 0.14);
    border: 1px solid var(--gold);
    border-radius: 9px;
    color: var(--gold);
    font-family: 'IBM Plex Sans KR', sans-serif;
    font-size: 13px; font-weight: 500;
    padding: 10px; cursor: pointer;
    transition: background 0.2s;
  }
  #briefBtn:hover { background: rgba(217, 164, 65, 0.28); }

  /* ---------- Hint ---------- */
  #hint {
    position: fixed; left: 26px; bottom: 26px; z-index: 5;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted); opacity: 0.7;
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="hud">
  <h1>Jarbiseo</h1>
  <div class="sub">Second Brain · Command Deck</div>
  <div class="status" id="statusLine">시스템 초기화 중…</div>
</div>

<div id="controls">
  <select id="voiceSelect" title="TTS 음성 선택"></select>
  <button class="ctl-btn" id="briefingBtn" title="아침 브리핑">🔔</button>
  <button class="ctl-btn" id="screenBtn" title="화면 공유 분석">🖥️</button>
</div>

<div id="hint">Drag · Rotate&nbsp;&nbsp;|&nbsp;&nbsp;Wheel · Zoom&nbsp;&nbsp;|&nbsp;&nbsp;Click · Node</div>

<div id="projectCard">
  <button id="cardClose">✕</button>
  <div id="cardName"></div>
  <div id="cardDesc"></div>
  <div id="cardChildren"></div>
  <button id="briefBtn">브리핑 요청</button>
</div>

<div id="chatPanel">
  <div id="chatHeader"><span>Jarbiseo Link</span><span class="dot" id="linkDot">● Online</span></div>
  <div id="messages"></div>
  <div id="inputRow">
    <button class="ctl-btn" id="micBtn" title="음성 입력">🎤</button>
    <input id="chatInput" type="text" placeholder="캡틴 님, 지시를 입력하세요…" autocomplete="off">
    <button id="sendBtn" title="전송">➤</button>
  </div>
</div>

<!-- three.js r128 vendored locally (served by our own Express server; no CDN dependency).
     CDN fallback kept in case vendor/ is ever missing. -->
<script src="vendor/three.min.js"></script>
<script>if (typeof THREE === 'undefined') document.write('<script src="https:\/\/cdnjs.cloudflare.com\/ajax\/libs\/three.js\/r128\/three.min.js"><\/script>');</script>
<script>
'use strict';

/* ==========================================================================
   JARBISEO front-end (Phase 2)
   Node map comes from GET /api/brain; chat is proxied via POST /api/chat.
   No API key ever touches the browser.
   ========================================================================== */

const MAX_HISTORY = 24; // keep the last 24 turns in memory

const state = {
  brain: [],
  history: [],
  busy: false,
  selectedNode: null,
  highlighted: new Map(), // nodeId -> pulse end timestamp
};

const $ = (id) => document.getElementById(id);

/* --------------------------------------------------------------------------
   3D orbital node map (three.js r128)
   -------------------------------------------------------------------------- */

const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const sceneGL = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(58, 1, 0.1, 2000);
camera.position.set(0, 34, 120);
camera.lookAt(0, 0, 0);

const brainGroup = new THREE.Group();
sceneGL.add(brainGroup);

// Star field backdrop
(function makeStars() {
  const geo = new THREE.BufferGeometry();
  const n = 900;
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n * 3; i++) pos[i] = (Math.random() - 0.5) * 900;
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: 0x2a3a55, size: 1.1, sizeAttenuation: true });
  sceneGL.add(new THREE.Points(geo, mat));
})();

// Central core — the "brain" nucleus
const core = new THREE.Mesh(
  new THREE.IcosahedronGeometry(6, 1),
  new THREE.MeshBasicMaterial({ color: 0xd9a441, wireframe: true, transparent: true, opacity: 0.75 })
);
brainGroup.add(core);
const coreGlow = makeGlowSprite(0xd9a441, 30);
brainGroup.add(coreGlow);

// Radial-gradient sprite used as a glow halo
function makeGlowSprite(colorHex, size) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const col = new THREE.Color(colorHex);
  const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 64);
  g.addColorStop(0, `rgba(${col.r * 255 | 0},${col.g * 255 | 0},${col.b * 255 | 0},0.85)`);
  g.addColorStop(0.4, `rgba(${col.r * 255 | 0},${col.g * 255 | 0},${col.b * 255 | 0},0.25)`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c),
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    transparent: true,
  }));
  sprite.scale.set(size, size, 1);
  return sprite;
}

// Text label sprite (JetBrains Mono, uppercase HUD style)
function makeLabelSprite(text) {
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const font = '500 26px "JetBrains Mono", monospace';
  ctx.font = font;
  const w = Math.ceil(ctx.measureText(text.toUpperCase()).width) + 24;
  c.width = w; c.height = 44;
  ctx.font = font;
  ctx.fillStyle = 'rgba(230, 233, 239, 0.92)';
  ctx.textBaseline = 'middle';
  ctx.fillText(text.toUpperCase(), 12, 24);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: new THREE.CanvasTexture(c),
    depthWrite: false,
    transparent: true,
  }));
  sprite.scale.set(w / 9, 44 / 9, 1);
  return sprite;
}

const clickableMeshes = [];
const nodeObjects = []; // { data, pivot, mesh, glow, baseColor, childPivots }

function buildNodeMap(nodes) {
  // Clear previous nodes (keep core + stars)
  for (const obj of nodeObjects) brainGroup.remove(obj.pivot, obj.ring);
  nodeObjects.length = 0;
  clickableMeshes.length = 0;

  nodes.forEach((data, i) => {
    const tilt = (i % 2 ? 1 : -1) * (0.12 + 0.05 * i);

    // Orbit ring
    const ringPts = [];
    for (let a = 0; a <= 128; a++) {
      const t = (a / 128) * Math.PI * 2;
      ringPts.push(new THREE.Vector3(Math.cos(t) * data.orbit, 0, Math.sin(t) * data.orbit));
    }
    const ring = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(ringPts),
      new THREE.LineBasicMaterial({ color: 0x22304a, transparent: true, opacity: 0.55 })
    );
    ring.rotation.x = tilt;
    brainGroup.add(ring);

    // Pivot rotates → node orbits
    const pivot = new THREE.Object3D();
    pivot.rotation.x = tilt;
    pivot.rotation.y = Math.random() * Math.PI * 2;
    brainGroup.add(pivot);

    const holder = new THREE.Object3D();
    holder.position.x = data.orbit;
    pivot.add(holder);

    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(2.3, 24, 24),
      new THREE.MeshBasicMaterial({ color: data.color })
    );
    mesh.userData.nodeId = data.id;
    holder.add(mesh);
    clickableMeshes.push(mesh);

    const glow = makeGlowSprite(data.color, 13);
    holder.add(glow);

    const label = makeLabelSprite(data.name);
    label.position.y = 5.2;
    holder.add(label);

    // Child nodes on a small local orbit
    const childPivots = [];
    (data.children || []).forEach((childName, j) => {
      const cp = new THREE.Object3D();
      cp.rotation.y = (j / Math.max(1, data.children.length)) * Math.PI * 2;
      cp.rotation.x = 0.35;
      holder.add(cp);
      const cm = new THREE.Mesh(
        new THREE.SphereGeometry(0.72, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0x3fa7a0, transparent: true, opacity: 0.9 })
      );
      cm.position.x = 6.2;
      cp.add(cm);
      childPivots.push(cp);
    });

    nodeObjects.push({ data, pivot, holder, mesh, glow, ring, baseColor: data.color, childPivots });
  });
}

// Drag-rotate + wheel-zoom + click picking
let dragging = false, dragMoved = 0, lastX = 0, lastY = 0;
let targetRotY = 0, targetRotX = 0;

canvas.addEventListener('pointerdown', (e) => {
  dragging = true; dragMoved = 0; lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  dragMoved += Math.abs(dx) + Math.abs(dy);
  targetRotY += dx * 0.004;
  targetRotX = Math.max(-0.9, Math.min(0.9, targetRotX + dy * 0.003));
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('pointerup', () => { dragging = false; });

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  camera.position.z = Math.max(45, Math.min(240, camera.position.z + e.deltaY * 0.08));
}, { passive: false });

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
canvas.addEventListener('click', (e) => {
  if (dragMoved > 6) return; // it was a drag, not a click
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickableMeshes);
  if (hits.length > 0) {
    const node = state.brain.find((n) => n.id === hits[0].object.userData.nodeId);
    if (node) showProjectCard(node);
  }
});

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
(function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  brainGroup.rotation.y += (targetRotY - brainGroup.rotation.y) * 0.06;
  brainGroup.rotation.x += (targetRotX - brainGroup.rotation.x) * 0.06;
  core.rotation.y += dt * 0.25;
  core.rotation.x += dt * 0.1;

  const now = performance.now();
  for (const obj of nodeObjects) {
    obj.pivot.rotation.y += dt * obj.data.speed * 6;
    for (const cp of obj.childPivots) cp.rotation.y += dt * 0.9;

    // Gold pulse for keyword-highlighted nodes
    const until = state.highlighted.get(obj.data.id);
    if (until && now < until) {
      const s = 1 + 0.35 * Math.abs(Math.sin(t * 5));
      obj.mesh.scale.setScalar(s);
      obj.mesh.material.color.setHex(0xd9a441);
      obj.glow.material.opacity = 0.6 + 0.4 * Math.abs(Math.sin(t * 5));
    } else {
      if (until) state.highlighted.delete(obj.data.id);
      obj.mesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
      obj.mesh.material.color.setHex(obj.baseColor);
      obj.glow.material.opacity = 1;
    }
  }
  renderer.render(sceneGL, camera);
})();

/* --------------------------------------------------------------------------
   Node map data + keyword highlighting
   -------------------------------------------------------------------------- */

async function loadBrain() {
  try {
    const res = await fetch('/api/brain');
    const data = await res.json();
    state.brain = data.nodes || [];
    buildNodeMap(state.brain);
    const src = data.source === 'scan' ? '폴더 스캔' : '기본 노드';
    $('statusLine').textContent = `노드 맵 온라인 · ${state.brain.length}개 프로젝트 (${src})`;
  } catch (err) {
    $('statusLine').textContent = '노드 맵 로드 실패 — 서버 상태를 확인하세요.';
    console.error(err);
  }
}

function highlightByKeywords(text) {
  const lower = text.toLowerCase();
  for (const node of state.brain) {
    const hit = (node.keywords || []).some((k) => k && lower.includes(String(k).toLowerCase()))
      || lower.includes(node.name.toLowerCase());
    if (hit) state.highlighted.set(node.id, performance.now() + 5000);
  }
}

/* --------------------------------------------------------------------------
   Project card
   -------------------------------------------------------------------------- */

function showProjectCard(node) {
  state.selectedNode = node;
  $('cardName').textContent = node.name;
  $('cardDesc').textContent = node.desc || '';
  const wrap = $('cardChildren');
  wrap.innerHTML = '';
  (node.children || []).forEach((c) => {
    const s = document.createElement('span');
    s.textContent = c;
    wrap.appendChild(s);
  });
  $('projectCard').classList.add('show');
  $('hint').style.display = 'none';
  state.highlighted.set(node.id, performance.now() + 4000);
}
$('cardClose').addEventListener('click', () => {
  $('projectCard').classList.remove('show');
  $('hint').style.display = '';
});
$('briefBtn').addEventListener('click', () => {
  if (!state.selectedNode) return;
  sendMessage(`"${state.selectedNode.name}" 프로젝트에 대해 브리핑해 주세요. 하위 항목: ${(state.selectedNode.children || []).join(', ') || '없음'}. 설명: ${state.selectedNode.desc || ''}`);
});

/* --------------------------------------------------------------------------
   Chat (via server proxy — no key in browser)
   -------------------------------------------------------------------------- */

function addBubble(role, text) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const who = role === 'user' ? 'Captain' : role === 'assistant' ? 'Jarbiseo' : 'System';
  div.innerHTML = `<div class="who">${who}</div><div class="bubble"></div>`;
  div.querySelector('.bubble').textContent = text;
  $('messages').appendChild(div);
  $('messages').scrollTop = $('messages').scrollHeight;
}

function extractText(apiResponse) {
  if (!apiResponse || !Array.isArray(apiResponse.content)) return '';
  return apiResponse.content
    .filter((b) => b.type === 'text')
    .map((b) => b.text)
    .join('\n')
    .trim();
}

async function sendMessage(text, imageBlock) {
  if (state.busy) return;
  const trimmed = (text || '').trim();
  if (!trimmed && !imageBlock) return;

  state.busy = true;
  $('sendBtn').disabled = true;
  $('linkDot').textContent = '● Thinking…';

  const displayText = trimmed || '(화면 캡처 분석 요청)';
  addBubble('user', displayText);
  highlightByKeywords(displayText);

  // Image messages are sent once, then stored as a text placeholder so the
  // history payload stays small on later turns.
  const content = imageBlock
    ? [imageBlock, { type: 'text', text: trimmed || '캡틴의 현재 화면입니다. 무엇이 보이는지 분석해서 보고해 주세요.' }]
    : trimmed;
  state.history.push({ role: 'user', content });

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ messages: state.history }),
    });
    const data = await res.json();

    if (imageBlock) {
      state.history[state.history.length - 1] = { role: 'user', content: `${trimmed || ''} [화면 캡처 이미지 전송됨]`.trim() };
    }

    if (!res.ok) {
      addBubble('system', data.error || '오류가 발생했습니다.');
      state.history.pop(); // keep failed turn out of history
    } else {
      const reply = extractText(data) || '…응답이 비어 있습니다, 캡틴 님.';
      state.history.push({ role: 'assistant', content: reply });
      addBubble('assistant', reply);
      highlightByKeywords(reply);
      speak(reply);
    }
  } catch (err) {
    console.error(err);
    addBubble('system', '서버에 연결하지 못했습니다. 서버가 실행 중인지 확인해 주세요.');
    state.history.pop();
  } finally {
    // Trim memory to the last N turns
    if (state.history.length > MAX_HISTORY) {
      state.history = state.history.slice(-MAX_HISTORY);
    }
    state.busy = false;
    $('sendBtn').disabled = false;
    $('linkDot').textContent = '● Online';
    // Anything the captain said while we were busy goes out now
    if (pendingUtterance) {
      const next = pendingUtterance;
      pendingUtterance = null;
      sendMessage(next);
    }
  }
}

$('sendBtn').addEventListener('click', () => {
  const v = $('chatInput').value;
  $('chatInput').value = '';
  sendMessage(v);
});
$('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.isComposing) {
    const v = $('chatInput').value;
    $('chatInput').value = '';
    sendMessage(v);
  }
});

// Morning briefing 🔔
$('briefingBtn').addEventListener('click', () => {
  const names = state.brain.map((n) => n.name).join(', ');
  sendMessage(`아침 브리핑을 부탁합니다. 오늘 날짜와 함께, 제 프로젝트(${names}) 중 오늘 집중하면 좋을 항목을 제안하고, 필요하면 관련 최신 뉴스를 웹에서 검색해 짧게 요약해 주세요.`);
});

/* --------------------------------------------------------------------------
   STT — Web Speech API (ko-KR), hands-free continuous mode
   One click on 🎤 = always listening (toggle off with another click).
   Recognition is paused while TTS speaks so JARBISEO doesn't hear itself,
   and auto-restarted whenever Chrome ends the session (silence timeout).
   -------------------------------------------------------------------------- */

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let handsFree = false;      // user toggled always-on listening
let ttsSpeaking = false;    // TTS active (or about to be) → keep STT paused
let recActive = false;      // recognition session actually running
let pendingUtterance = null; // speech captured while a request was in flight

if (SR) {
  recognition = new SR();
  recognition.lang = 'ko-KR';
  recognition.continuous = true;
  recognition.interimResults = true;

  recognition.onstart = () => { recActive = true; };

  recognition.onresult = (e) => {
    let interim = '';
    // Only walk results added since the last event
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) {
        const text = r[0].transcript.trim();
        $('chatInput').value = '';
        if (text.length >= 2) queueUtterance(text); // ignore 1-char noise
      } else {
        interim += r[0].transcript;
      }
    }
    if (interim) $('chatInput').value = interim; // live preview while speaking
  };

  // Chrome stops recognition after silence — restart while hands-free is on
  recognition.onend = () => {
    recActive = false;
    if (handsFree && !ttsSpeaking) restartRecognition();
    updateMicUI();
  };
  recognition.onerror = (e) => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      handsFree = false;
      addBubble('system', '마이크 사용 권한이 없습니다. 주소창의 자물쇠 아이콘에서 마이크를 허용해 주세요.');
      updateMicUI();
    }
    // 'no-speech' / 'aborted' are routine in always-on mode → onend restarts
  };
}

function restartRecognition(delay = 300) {
  setTimeout(() => {
    if (!handsFree || ttsSpeaking || recActive || !recognition) return;
    try { recognition.start(); } catch (_) { /* already running */ }
  }, delay);
}

// Keep-alive: Chrome sometimes drops onend/onerror events entirely, which
// would leave the mic dead until the next click. Re-arm every 2s no matter
// which event was missed.
setInterval(() => {
  if (handsFree && !ttsSpeaking && !recActive && recognition) {
    try { recognition.start(); } catch (_) {}
  }
}, 2000);

function queueUtterance(text) {
  if (state.busy) {
    // A reply is in flight — remember the latest utterance and send it next
    pendingUtterance = pendingUtterance ? `${pendingUtterance} ${text}` : text;
    return;
  }
  sendMessage(text);
}

function updateMicUI() {
  $('micBtn').classList.toggle('listening', handsFree);
  $('micBtn').title = handsFree ? '상시 청취 중 — 클릭하면 끄기' : '음성 입력 (클릭하면 상시 청취 시작)';
  $('chatInput').placeholder = handsFree
    ? '상시 청취 중… 그냥 말씀하세요, 캡틴 님'
    : '캡틴 님, 지시를 입력하세요…';
}

$('micBtn').addEventListener('click', () => {
  if (!recognition) { addBubble('system', '이 브라우저는 음성 인식을 지원하지 않습니다. (Chrome 권장)'); return; }
  handsFree = !handsFree;
  if (handsFree) {
    window.speechSynthesis.cancel(); // don't listen to our own TTS
    ttsSpeaking = false;
    try { recognition.start(); } catch (_) {}
    addBubble('system', '상시 청취 모드를 켰습니다. 마이크 버튼을 다시 누르면 꺼집니다.');
  } else {
    recognition.abort();
    pendingUtterance = null;
    addBubble('system', '상시 청취 모드를 껐습니다.');
  }
  updateMicUI();
});

/* --------------------------------------------------------------------------
   TTS — speechSynthesis + 2.5s silent-voice watchdog
   -------------------------------------------------------------------------- */

const voiceStatus = new Map(); // voiceURI -> 'ok' | 'bad'
let voices = [];
const PREFERRED_VOICE = /선히|sunhi/i; // captain's pinned voice
const TTS_RATE = 1.33; // ~30% faster than the previous 1.02
let currentUtterance = null; // global ref — Chrome GC kills onend on locals
let ttsPoll = null;

function refreshVoices() {
  voices = window.speechSynthesis.getVoices();
  const sel = $('voiceSelect');
  const prev = sel.value;
  sel.innerHTML = '';

  // Korean voices first, then the rest
  const sorted = [...voices].sort((a, b) => {
    const ak = a.lang.startsWith('ko') ? 0 : 1;
    const bk = b.lang.startsWith('ko') ? 0 : 1;
    return ak - bk || a.name.localeCompare(b.name);
  });

  for (const v of sorted) {
    const opt = document.createElement('option');
    opt.value = v.voiceURI;
    const mark = voiceStatus.get(v.voiceURI) === 'ok' ? ' ✓' : voiceStatus.get(v.voiceURI) === 'bad' ? ' ✕' : '';
    opt.textContent = `${v.name} (${v.lang})${mark}`;
    sel.appendChild(opt);
  }
  const preferred = sorted.find((v) => PREFERRED_VOICE.test(v.name) && voiceStatus.get(v.voiceURI) !== 'bad');
  if (prev && [...sel.options].some((o) => o.value === prev)) sel.value = prev;
  else if (preferred) sel.value = preferred.voiceURI; // pin 선히 by default
  else {
    const ko = sorted.find((v) => v.lang.startsWith('ko') && voiceStatus.get(v.voiceURI) !== 'bad');
    if (ko) sel.value = ko.voiceURI;
  }
}
window.speechSynthesis.onvoiceschanged = refreshVoices;
refreshVoices();

// Called whenever TTS finishes (or fails) — reopens the mic in hands-free mode
function ttsDone() {
  if (ttsPoll) { clearInterval(ttsPoll); ttsPoll = null; }
  currentUtterance = null;
  ttsSpeaking = false;
  if (handsFree) restartRecognition(400); // small gap so we don't hear our own tail
}

function speak(text) {
  if (!window.speechSynthesis || !text) return;
  window.speechSynthesis.cancel();

  // Pause STT so JARBISEO doesn't transcribe its own voice
  ttsSpeaking = true;
  if (handsFree && recognition) { try { recognition.abort(); } catch (_) {} }

  const utter = new SpeechSynthesisUtterance(text);
  currentUtterance = utter;
  const chosen = voices.find((v) => v.voiceURI === $('voiceSelect').value);
  if (chosen) { utter.voice = chosen; utter.lang = chosen.lang; }
  else utter.lang = 'ko-KR';
  utter.rate = TTS_RATE;

  // Watchdog: if the voice never starts within 2.5s it is silent/broken —
  // mark it ✕ and retry once with any other Korean voice.
  let started = false;
  utter.onstart = () => {
    started = true;
    if (chosen && voiceStatus.get(chosen.voiceURI) !== 'ok') {
      voiceStatus.set(chosen.voiceURI, 'ok');
      refreshVoices();
    }
  };
  utter.onend = ttsDone;
  utter.onerror = ttsDone;
  setTimeout(() => {
    if (started) return;
    window.speechSynthesis.cancel();
    let retried = false;
    if (chosen) {
      voiceStatus.set(chosen.voiceURI, 'bad');
      refreshVoices();
      const fallback = voices.find((v) => v.lang.startsWith('ko') && voiceStatus.get(v.voiceURI) !== 'bad' && v.voiceURI !== chosen.voiceURI);
      if (fallback) {
        retried = true;
        $('voiceSelect').value = fallback.voiceURI;
        const retry = new SpeechSynthesisUtterance(text);
        currentUtterance = retry;
        retry.voice = fallback; retry.lang = fallback.lang; retry.rate = TTS_RATE;
        retry.onstart = () => { voiceStatus.set(fallback.voiceURI, 'ok'); refreshVoices(); };
        retry.onend = ttsDone;
        retry.onerror = ttsDone;
        window.speechSynthesis.speak(retry);
      }
    }
    if (!retried) ttsDone(); // no sound is coming — reopen the mic
  }, 2500);

  window.speechSynthesis.speak(utter);

  // Chrome often never fires utterance onend (GC bug) — poll the engine
  // directly so hands-free listening always resumes after speech stops.
  if (ttsPoll) clearInterval(ttsPoll);
  const t0 = Date.now();
  ttsPoll = setInterval(() => {
    const s = window.speechSynthesis;
    if (!s.speaking && !s.pending && Date.now() - t0 > 3000) ttsDone();
  }, 300);
}

/* --------------------------------------------------------------------------
   Screen share analysis — getDisplayMedia → JPEG frame → Claude vision
   -------------------------------------------------------------------------- */

$('screenBtn').addEventListener('click', async () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    addBubble('system', '이 브라우저는 화면 공유를 지원하지 않습니다.');
    return;
  }
  let stream = null;
  try {
    $('screenBtn').classList.add('active');
    stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    const track = stream.getVideoTracks()[0];

    const video = document.createElement('video');
    video.srcObject = stream;
    await video.play();
    await new Promise((r) => setTimeout(r, 350)); // let the first frame render

    const cap = document.createElement('canvas');
    cap.width = video.videoWidth;
    cap.height = video.videoHeight;
    cap.getContext('2d').drawImage(video, 0, 0);
    track.stop();

    const dataUrl = cap.toDataURL('image/jpeg', 0.7);
    const base64 = dataUrl.split(',')[1];
    await sendMessage('', {
      type: 'image',
      source: { type: 'base64', media_type: 'image/jpeg', data: base64 },
    });
  } catch (err) {
    if (err && err.name !== 'NotAllowedError') {
      console.error(err);
      addBubble('system', '화면 캡처에 실패했습니다.');
    }
  } finally {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    $('screenBtn').classList.remove('active');
  }
});

/* --------------------------------------------------------------------------
   Boot
   -------------------------------------------------------------------------- */

loadBrain();
addBubble('assistant', '캡틴 님, 자비서 온라인입니다. 무엇을 도와드릴까요?');
</script>
